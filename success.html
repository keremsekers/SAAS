<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Commerce OS — Bestellung erfolgreich</title><style>body{margin:0;background:#f5f6f8;font-family:Inter,system-ui,sans-serif;color:#15171b;display:grid;place-items:center;min-height:100vh;padding:20px}.box{max-width:620px;background:#fff;border:1px solid #e3e6eb;border-radius:26px;padding:42px;box-shadow:0 24px 70px #1111;text-align:center}.ok{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#e7f7ef;color:#19734d;font-size:28px;margin:auto}h1{font-size:40px;letter-spacing:-.04em;margin:20px 0 10px}p{color:#66707d;line-height:1.6}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:25px}a{display:inline-block;padding:13px 17px;border-radius:12px;text-decoration:none;font-weight:900;background:#111;color:#fff}a.alt{background:#fff;color:#111;border:1px solid #dfe3e9}</style></head><body><main class="box"><div class="ok">✓</div><h1>Bestellung erfolgreich.</h1><p>Deine Zahlung wurde bestätigt. Der persönliche Download wird jetzt vorbereitet.</p><p>Siparişin başarıyla tamamlandı. Kişisel indirme dosyan hazırlanıyor.</p><div class="actions"><a id="download" href="#">⬇ Produkt herunterladen</a><a class="alt" href="/">← Shop / Mağaza</a></div></main><script>const q=new URLSearchParams(location.search),sid=q.get('session_id'),product=q.get('product');const a=document.getElementById('download');if(sid)a.href='/api/download?session_id='+encodeURIComponent(sid);else{a.href='/';a.textContent='Shop / Mağaza';}</script></body></html>

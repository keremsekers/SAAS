name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate product catalog
        run: |
          python - <<'PY'
          import json, pathlib, sys
          errors = []
          for p in pathlib.Path("products").glob("*/product.json"):
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  errors.append(f"{p}: invalid JSON: {e}")
                  continue
              for key in ["slug","type","status","price","locales","category","delivery"]:
                  if key not in data:
                      errors.append(f"{p}: missing {key}")
              for locale in ["de","tr"]:
                  if locale not in data.get("locales", []):
                      errors.append(f"{p}: missing locale {locale}")
                  if not (p.parent / f"{locale}.md").exists():
                      errors.append(f"{p}: missing {locale}.md")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Catalog OK")
          PY

<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Commerce OS Admin</title><style>body{font-family:system-ui;max-width:1100px;margin:40px auto;padding:20px;background:#f4f5f7;color:#111}input,button{padding:12px;border-radius:10px;border:1px solid #ddd}button{background:#111;color:#fff;cursor:pointer}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;padding:18px;border-radius:14px;min-width:180px}table{width:100%;background:#fff;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style><h1>✦ AI Commerce OS Admin</h1><p>Stripe sales dashboard</p><input id="key" type="password" placeholder="ADMIN_KEY"><button onclick="load()">Dashboard laden</button><div id="out"></div><script>async function load(){const r=await fetch('/api/admin?key='+encodeURIComponent(document.getElementById('key').value));const j=await r.json();if(!r.ok)return out.innerHTML='<p>'+j.error+'</p>';out.innerHTML='<div class="stats"><div class="stat"><b>Transactions</b><br>'+j.count+'</div><div class="stat"><b>Paid total</b><br>€'+j.total.toFixed(2)+'</div></div><table><tr><th>Date</th><th>Email</th><th>Product</th><th>Amount</th><th>Status</th></tr>'+j.sales.map(x=>'<tr><td>'+new Date(x.created).toLocaleString()+'</td><td>'+x.email+'</td><td>'+x.product+'</td><td>€'+Number(x.amount).toFixed(2)+'</td><td>'+x.paid+'</td></tr>').join('')+'</table>'}</script></html>
